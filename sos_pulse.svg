<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Pulse ring 1 -->
  <circle cx="100" cy="100" r="62" fill="none" stroke="#E24B4A" stroke-width="2.5">
    <animate attributeName="r" values="62;95;62" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <!-- Pulse ring 2 -->
  <circle cx="100" cy="100" r="62" fill="none" stroke="#E24B4A" stroke-width="1.5">
    <animate attributeName="r" values="62;78;62" dur="2.4s" begin="0.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
  <!-- Main button -->
  <circle cx="100" cy="100" r="60" fill="#E24B4A"/>
  <!-- Inner highlight ring -->
  <circle cx="100" cy="100" r="56" fill="none" stroke="#ff7070" stroke-width="1" opacity="0.4"/>
  <!-- SOS text -->
  <text x="100" y="114" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="30" font-weight="900" fill="white" letter-spacing="5">SOS</text>
</svg>
